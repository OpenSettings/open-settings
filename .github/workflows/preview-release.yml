name: Preview Release
run-name: Preview Release - ${{ github.ref_name }} - ${{ github.run_number }}.${{ github.run_attempt }}

on:
  workflow_dispatch:
        
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from branch name
        id: extract_version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          VERSION=$(echo "$BRANCH_NAME" | sed -E 's|preview/([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+|\1|')
          PREVIEW_NUMBER=$(echo "$BRANCH_NAME" | sed -E 's|preview/[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)|\1|')

          echo "Branch Name: $BRANCH_NAME"
          echo "Extracted Version: $VERSION"
          echo "Extracted Preview Number: $PREVIEW_NUMBER"
          
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Version should be in the format 'x.x.x'."
            exit 1
          fi

          if [[ ! "$PREVIEW_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid preview number format. Preview number should be a valid integer."
            exit 1
          fi

          # Export version and preview number to the environment
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PREVIEW_NUMBER=$PREVIEW_NUMBER" >> $GITHUB_ENV

      - name: Calculate full version with run and attempt
        id: calculate_full_version
        run: |
         VERSION_WITH_RUN="${{ env.VERSION }}-preview.${{ env.PREVIEW_NUMBER }}.${{ github.run_number }}.${{ github.run_attempt }}"

         # Export version with run to the environment
         echo "VERSION_WITH_RUN=$VERSION_WITH_RUN" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Project
        run: dotnet build --configuration Release /p:Version=${{ env.VERSION_WITH_RUN }}

      - name: Pack NuGet package
        run: dotnet pack --configuration Release --output nupkgs /p:PackageVersion=${{ env.VERSION_WITH_RUN }} /p:Version=${{ env.VERSION_WITH_RUN }}

      - name: Push NuGet packages
        run: |
          for package in OpenSettings.AspNetCore OpenSettings.AspNetCore.Spa OpenSettings; do
            dotnet nuget push nupkgs/${package}.${{ env.VERSION_WITH_RUN }}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
          done

      - name: Set up GitHub Actions bot user details
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create and push tag
        run: |
          TAG_NAME="v${{ env.VERSION_WITH_RUN }}"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Create GitHub Release
        run: gh release create v${{ env.VERSION_WITH_RUN }} --title "Preview Release v${{ env.VERSION_WITH_RUN }}" --notes "This is a preview release of version v${{ env.VERSION }}." --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
